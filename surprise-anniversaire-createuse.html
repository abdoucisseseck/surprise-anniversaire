<title>Ta surprise d’anniversaire 🎂</title>

<style>

:root[data-theme="dark"]{--bg:#0d0b2e;--fg:#fbf7ff;--ac:#f9a8d4;--ac2:#8b3dff;--on:#2a0a3a;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.22);color-scheme:dark}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

.prog{width:100%;display:flex;justify-content:space-between;position:relative;padding:0 2px}

.prog span{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;background:var(--bg);border:2px solid var(--line);transition:.4s}
.prog .done{background:var(--ac);color:var(--on);border-color:var(--ac)}.prog .now{border-color:var(--ac);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--ac)}70%,100%{box-shadow:0 0 0 9px transparent}}
#snd{position:absolute;top:60px;right:14px;z-index:5;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:inherit;font-size:1rem;cursor:pointer}
#stage{width:100%;flex:1;display:flex}
.step{width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}

@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
h2{font-family:var(--serif);font-weight:500;font-size:1.7rem;line-height:1.25}

.btn:active{transform:scale(.96)}.btn.ghost{background:transparent;color:inherit;border-color:var(--line)}.btn[hidden]{display:none}
.glow{animation:glow 2.6s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 26px var(--ac)}}

.floaty{display:flex;gap:18px;font-size:1.8rem}.floaty span{animation:bob 3s ease-in-out infinite}.floaty span:nth-child(2){animation-delay:-.7s}.floaty span:nth-child(3){animation-delay:-1.4s}.floaty span:nth-child(4){animation-delay:-2.1s}

.opts{display:grid;gap:10px;width:100%}
.opt{font:inherit;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:inherit;cursor:pointer;animation:fade .45s ease both}

.wall{display:grid;gap:12px;width:100%}
.flip{display:grid;perspective:900px;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}

.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:18px;border:1px solid var(--line);min-height:96px;display:grid;place-items:center}
.front{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;font-weight:600}
.back{background:var(--card);transform:rotateY(180deg);font-family:var(--serif);font-style:italic;font-size:1.15rem}
.stagewrap{perspective:900px;height:370px;display:grid;place-items:center}
.phone3d{position:relative;width:190px;height:340px;border-radius:30px;border:6px solid #1b1736;overflow:hidden;color:#fff;background:linear-gradient(160deg,#2b0f5c,#0b0a24 60%,#5b21b6);box-shadow:0 0 40px rgba(139,61,255,.55),0 20px 40px rgba(0,0,0,.35);transform-style:preserve-3d;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotateY(-16deg) rotateX(5deg)}50%{transform:rotateY(16deg) rotateX(-3deg) translateY(-10px)}}
.tt-side{position:absolute;right:8px;bottom:70px;display:grid;gap:12px;font-size:1.2rem}.tt-side small{display:block;font-size:.6rem}
.tt-user{position:absolute;left:10px;bottom:34px;font-size:.78rem;font-weight:600}.tt-cap{position:absolute;left:10px;bottom:14px;font-size:.7rem;opacity:.85}
.cmt{position:absolute;left:10px;right:44px;bottom:84px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.16);font-size:.74rem;text-align:left;animation:cm 1.7s ease both}
@keyframes cm{0%{opacity:0;transform:translateY(12px)}15%,80%{opacity:1;transform:none}to{opacity:0;transform:translateY(-14px)}}

.msgs{min-height:4em;font-family:var(--serif);font-size:1.45rem;line-height:1.3}.msgs p{animation:fade .7s ease both}
.gift-wrap{background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:grid;gap:16px;justify-items:center;margin:40px 0}
.gift-wrap small{animation:glow 2s ease-in-out infinite;border-radius:99px;padding:2px 10px}
.gift{position:relative;display:block;width:110px;height:110px}.gb{position:absolute;bottom:0;left:0;right:0;height:72px;background:var(--ac);border-radius:8px;box-shadow:inset -50px 0 0 -42px rgba(255,255,255,.6)}

.letter .t{font-style:normal;font-size:1.7rem;color:var(--ac)}.letter .sg{text-align:right;color:var(--ac)}

</style>
</head>
